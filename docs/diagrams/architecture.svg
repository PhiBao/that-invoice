<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-labelledby="t d"><title id='t'>Architecture</title><desc id='d'>Browser, Rust API, NEAR contracts and NEAR Intents.</desc><rect width="1280" height="620" fill="#f1ebdc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#15120d"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#c93a1e"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1d5a3b"/></marker></defs><text x="40" y="52" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="30" fill="#15120d" text-anchor="start" font-weight="500" font-style="normal" letter-spacing="0">Architecture</text><text x="40" y="78" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#7d7464" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The chain is the source of truth. The API reads it, signs for the demo personas, and proxies quotes.</text><rect x="40" y="120" width="270" height="190" fill="#fbf7ec" stroke="#15120d" stroke-width="1.4"/><text x="56" y="148" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#15120d" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Browser</text><text x="296" y="146" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#c93a1e" text-anchor="end" font-weight="600" font-style="normal" letter-spacing="1">TYPESCRIPT</text><text x="56" y="172" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Next.js 16 · React 19</text><text x="56" y="191" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">invoice document with a back side</text><text x="56" y="210" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">ledger, buyer desk, live demo</text><text x="56" y="229" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">SSE keeps it in sync</text><text x="56" y="248" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">persona switcher</text><rect x="380" y="120" width="330" height="190" fill="#fbf7ec" stroke="#15120d" stroke-width="1.4"/><text x="396" y="148" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#15120d" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Rust API (Axum, Tokio)</text><text x="696" y="146" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#c93a1e" text-anchor="end" font-weight="600" font-style="normal" letter-spacing="1">RUST</text><text x="396" y="172" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">read model: polls registry, caches, SSE</text><text x="396" y="191" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">act: signs txs for demo personas</text><text x="396" y="210" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">demo: a server-side job; clients replay it</text><text x="396" y="229" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">quote: 1Click dry-run proxy</text><text x="396" y="248" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">docs: SHA-256 content store</text><text x="396" y="267" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">rate limits; keys only in env/secrets</text><rect x="780" y="120" width="460" height="190" fill="#fbf7ec" stroke="#15120d" stroke-width="1.4"/><text x="796" y="148" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#15120d" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">NEAR testnet</text><text x="1226" y="146" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#c93a1e" text-anchor="end" font-weight="600" font-style="normal" letter-spacing="1">CONTRACTS</text><text x="796" y="172" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">registry.testnet   NEP-171 + market + records</text><text x="796" y="191" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">inv-N.registry     one account per invoice,</text><text x="796" y="210" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">                   shared immutable global contract</text><text x="796" y="229" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">usdc.testnet       NEP-141 (demo USDC)</text><text x="796" y="248" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">public RPC (fastnear)</text><rect x="380" y="380" width="330" height="130" fill="#fbf7ec" stroke="#15120d" stroke-width="1.4"/><text x="396" y="408" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#15120d" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">NEAR Intents · 1Click API</text><text x="696" y="406" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#c93a1e" text-anchor="end" font-weight="600" font-style="normal" letter-spacing="1">EXTERNAL</text><text x="396" y="432" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">dry quotes: what a Base, Arbitrum,</text><text x="396" y="451" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Ethereum or Solana payer would send</text><text x="396" y="470" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">mainnet liquidity; no testnet exists</text><rect x="40" y="380" width="270" height="130" fill="#fbf7ec" stroke="#15120d" stroke-width="1.4"/><text x="56" y="408" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#15120d" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Document store</text><text x="296" y="406" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#c93a1e" text-anchor="end" font-weight="600" font-style="normal" letter-spacing="1">FILES</text><text x="56" y="432" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">invoice line items stay off-chain</text><text x="56" y="451" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">only the hash is on-chain</text><text x="56" y="470" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">GET re-verifies the hash</text><rect x="780" y="380" width="460" height="130" fill="#fbf7ec" stroke="#15120d" stroke-width="1.4"/><text x="796" y="408" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#15120d" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Explorer</text><text x="1226" y="406" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#c93a1e" text-anchor="end" font-weight="600" font-style="normal" letter-spacing="1">PROOF</text><text x="796" y="432" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">every demo step links to its tx</text><text x="796" y="451" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">invoice accounts are viewable on nearblocks</text><text x="796" y="470" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.2" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">events: NEP-171 + thatinvoice/1.0.0 (NEP-297)</text><line x1="310" y1="200" x2="372" y2="200" stroke="#15120d" stroke-width="1.7" marker-end="url(#a)"/><text x="341" y="190" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">/api</text><line x1="372" y1="245" x2="310" y2="245" stroke="#15120d" stroke-width="1.7" marker-end="url(#a)"/><text x="341" y="262" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">SSE</text><line x1="710" y1="190" x2="772" y2="190" stroke="#15120d" stroke-width="1.7" marker-end="url(#a)"/><text x="741" y="180" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">views</text><line x1="710" y1="250" x2="772" y2="250" stroke="#c93a1e" stroke-width="1.7" marker-end="url(#ar)"/><text x="741" y="268" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#c93a1e" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">txs</text><line x1="545" y1="310" x2="545" y2="372" stroke="#15120d" stroke-width="1.7" marker-end="url(#a)"/><text x="575" y="345" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">quote</text><line x1="420" y1="310" x2="300" y2="392" stroke="#15120d" stroke-width="1.7" marker-end="url(#a)"/><text x="330" y="348" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">docs</text><text x="40" y="570" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#7d7464" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Contracts: Rust + near-sdk 5.30 (wasm, wasm-opt). Server: Rust. UI: TypeScript. The browser never holds a key: demo personas are signed for server-side.</text></svg>