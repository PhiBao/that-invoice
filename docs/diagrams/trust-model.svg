<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d"><title id='t'>Where the money can go</title><desc id='d'>The invoice account has one exit, and four checks stand in front of it.</desc><rect width="1280" height="640" fill="#f1ebdc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#15120d"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#c93a1e"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1d5a3b"/></marker></defs><text x="40" y="52" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="30" fill="#15120d" text-anchor="start" font-weight="500" font-style="normal" letter-spacing="0">The money has one way out</text><text x="40" y="78" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#7d7464" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Anyone can pay an invoice. Only the current owner can collect it. No key anywhere can do anything else.</text><rect x="40" y="250" width="200" height="110" fill="#fbf7ec" stroke="#15120d" stroke-width="1.2"/><text x="140" y="285" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#15120d" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">Any payer</text><text x="140" y="308" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">any chain, any wallet</text><text x="140" y="330" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">NEAR Intents on mainnet</text><line x1="240" y1="305" x2="332" y2="305" stroke="#1d5a3b" stroke-width="2.2" marker-end="url(#ag)"/><text x="286" y="292" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#1d5a3b" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">USDC</text><rect x="340" y="190" width="290" height="230" fill="#fbf7ec" stroke="#15120d" stroke-width="1.6"/><text x="485" y="224" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#15120d" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">inv-3.registry</text><text x="485" y="246" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#4a443a" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">holds the invoice's USDC</text><rect x="364" y="268" width="242" height="26" fill="#f1ebdc" stroke="#d5cab3"/><text x="485" y="286" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">no access keys</text><rect x="364" y="302" width="242" height="26" fill="#f1ebdc" stroke="#d5cab3"/><text x="485" y="320" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">immutable code, by hash</text><rect x="364" y="336" width="242" height="26" fill="#f1ebdc" stroke="#d5cab3"/><text x="485" y="354" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">one method moves funds: release()</text><rect x="364" y="370" width="242" height="26" fill="#f1ebdc" stroke="#d5cab3"/><text x="485" y="388" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">only the registry may call it</text><line x1="630" y1="305" x2="694" y2="305" stroke="#15120d" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="250" width="140" height="110" fill="#fbf7ec" stroke="#c93a1e" stroke-width="1.6"/><text x="770" y="274" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#c93a1e" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="1">CHECK 1</text><text x="770" y="290" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">registry.claim()</text><text x="770" y="314" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">caller must be the</text><text x="770" y="332" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">current owner</text><line x1="840" y1="305" x2="854" y2="305" stroke="#15120d" stroke-width="2" marker-end="url(#a)"/><rect x="860" y="250" width="140" height="110" fill="#fbf7ec" stroke="#c93a1e" stroke-width="1.6"/><text x="930" y="274" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#c93a1e" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="1">CHECK 2</text><text x="930" y="290" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">registry.claim()</text><text x="930" y="314" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">status must be Paid</text><text x="930" y="332" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">(not Listed, Claiming,</text><text x="930" y="350" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">or Claimed)</text><line x1="1000" y1="305" x2="1014" y2="305" stroke="#15120d" stroke-width="2" marker-end="url(#a)"/><rect x="1020" y="250" width="140" height="110" fill="#fbf7ec" stroke="#c93a1e" stroke-width="1.6"/><text x="1090" y="274" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#c93a1e" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="1">CHECK 3</text><text x="1090" y="290" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">invoice account</text><text x="1090" y="314" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">release() runs only</text><text x="1090" y="332" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">when the registry</text><text x="1090" y="350" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#15120d" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">calls it</text><line x1="1160" y1="305" x2="1186" y2="305" stroke="#1d5a3b" stroke-width="2.4" marker-end="url(#ag)"/><text x="1222" y="296" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#1d5a3b" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">current</text><text x="1222" y="314" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#1d5a3b" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">owner</text><line x1="40" y1="470" x2="1240" y2="470" stroke="#15120d" stroke-width="1.2"/><text x="40" y="504" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="20" fill="#15120d" text-anchor="start" font-weight="500" font-style="normal" letter-spacing="0">What this rules out</text><text x="40" y="540" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#c93a1e" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Selling twice</text><text x="40" y="562" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">issue() refuses a repeated (issuer,</text><text x="40" y="581" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">debtor, number). After a sale the old</text><text x="40" y="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">owner fails the owner check.</text><text x="340" y="540" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#c93a1e" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Paying the wrong person</text><text x="340" y="562" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The payee is read at claim time, so a</text><text x="340" y="581" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">sale moves the right to the money</text><text x="340" y="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">without moving the address.</text><text x="640" y="540" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#c93a1e" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Racing a sale against a payout</text><text x="640" y="562" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Listed and Claiming lock the token. A</text><text x="640" y="581" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">payout in flight blocks transfer,</text><text x="640" y="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">listing and a second claim.</text><text x="940" y="540" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#c93a1e" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">Nobody can change the rules</text><text x="940" y="562" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The invoice contract is immutable by</text><text x="940" y="581" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">hash, and the registry's access keys</text><text x="940" y="600" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">are deleted. Anyone can verify both</text><text x="940" y="619" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#4a443a" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">with scripts/verify-deployment.mjs.</text></svg>