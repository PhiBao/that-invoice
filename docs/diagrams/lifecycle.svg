<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 960" width="1340" height="960" role="img" aria-labelledby="t d"><title id='t'>Invoice lifecycle</title><desc id='d'>Sequence of an invoice being issued, confirmed, sold, paid and collected.</desc><rect width="1340" height="960" fill="#f1ebdc"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#15120d"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#c93a1e"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#1d5a3b"/></marker></defs><text x="40" y="52" font-family="Newsreader, 'Iowan Old Style', Georgia, serif" font-size="30" fill="#15120d" text-anchor="start" font-weight="500" font-style="normal" letter-spacing="0">One invoice, from issue to collection</text><text x="40" y="78" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#7d7464" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Every arrow is a real call on NEAR. Red arrows are what the contract refuses.</text><rect x="38" y="88" width="164" height="50" fill="#fbf7ec" stroke="#15120d" stroke-width="1.2"/><text x="120" y="109" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#15120d" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">Studio Nine</text><text x="120" y="126" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0.8">issuer</text><line x1="120" y1="138" x2="120" y2="930" stroke="#d5cab3" stroke-width="1.4" stroke-dasharray="3 5"/><rect x="248" y="88" width="164" height="50" fill="#fbf7ec" stroke="#15120d" stroke-width="1.2"/><text x="330" y="109" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#15120d" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">Acme DAO</text><text x="330" y="126" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0.8">client</text><line x1="330" y1="138" x2="330" y2="930" stroke="#d5cab3" stroke-width="1.4" stroke-dasharray="3 5"/><rect x="478" y="88" width="164" height="50" fill="#fbf7ec" stroke="#15120d" stroke-width="1.2"/><text x="560" y="109" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#15120d" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">Registry</text><text x="560" y="126" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0.8">contract</text><line x1="560" y1="138" x2="560" y2="930" stroke="#d5cab3" stroke-width="1.4" stroke-dasharray="3 5"/><rect x="708" y="88" width="164" height="50" fill="#fbf7ec" stroke="#15120d" stroke-width="1.2"/><text x="790" y="109" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#15120d" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">inv-N account</text><text x="790" y="126" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0.8">global contract</text><line x1="790" y1="138" x2="790" y2="930" stroke="#d5cab3" stroke-width="1.4" stroke-dasharray="3 5"/><rect x="928" y="88" width="164" height="50" fill="#fbf7ec" stroke="#15120d" stroke-width="1.2"/><text x="1010" y="109" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#15120d" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">Northfield Fund</text><text x="1010" y="126" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0.8">investor</text><line x1="1010" y1="138" x2="1010" y2="930" stroke="#d5cab3" stroke-width="1.4" stroke-dasharray="3 5"/><rect x="1138" y="88" width="164" height="50" fill="#fbf7ec" stroke="#15120d" stroke-width="1.2"/><text x="1220" y="109" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#15120d" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">USDC</text><text x="1220" y="126" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0.8">NEP-141</text><line x1="1220" y1="138" x2="1220" y2="930" stroke="#d5cab3" stroke-width="1.4" stroke-dasharray="3 5"/><circle cx="120" cy="174" r="0"/><line x1="120" y1="174" x2="556" y2="174" stroke="#15120d" stroke-width="1.8" marker-end="url(#a)"/><circle cx="120" cy="174" r="3.2" fill="#15120d"/><text x="340.0" y="165" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#15120d" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">issue(acme, 0042, $1,200)</text><text x="340.0" y="191" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">attach 0.1 NEAR</text><circle cx="560" cy="226" r="0"/><line x1="560" y1="226" x2="786" y2="226" stroke="#15120d" stroke-width="1.8" marker-end="url(#a)"/><circle cx="560" cy="226" r="3.2" fill="#15120d"/><text x="675.0" y="217" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#15120d" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">create_account + use_global_contract + new()</text><circle cx="560" cy="270" r="0"/><line x1="560" y1="270" x2="1216" y2="270" stroke="#15120d" stroke-width="1.8" marker-end="url(#a)"/><circle cx="560" cy="270" r="3.2" fill="#15120d"/><text x="890.0" y="261" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#15120d" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">storage_deposit(inv-N)</text><text x="890.0" y="287" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">so the account can hold USDC</text><rect x="685.0" y="304" width="210" height="30" fill="#fbf7ec" stroke="#1d5a3b" stroke-width="1.4"/><text x="790" y="324" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#1d5a3b" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0">inv-3.registry now exists</text><circle cx="120" cy="362" r="0"/><line x1="120" y1="362" x2="556" y2="362" stroke="#c93a1e" stroke-width="1.8" marker-end="url(#ar)" stroke-dasharray="5 4"/><circle cx="120" cy="362" r="3.2" fill="#c93a1e"/><text x="340.0" y="353" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#c93a1e" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">issue(acme, 0042, $1,200) again</text><text x="574" y="384" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#c93a1e" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">refused: already exists as inv-3</text><circle cx="330" cy="428" r="0"/><line x1="330" y1="428" x2="556" y2="428" stroke="#15120d" stroke-width="1.8" marker-end="url(#a)"/><circle cx="330" cy="428" r="3.2" fill="#15120d"/><text x="445.0" y="419" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#15120d" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">confirm(inv-3)</text><text x="445.0" y="445" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">only the debtor can</text><circle cx="120" cy="480" r="0"/><line x1="120" y1="480" x2="556" y2="480" stroke="#15120d" stroke-width="1.8" marker-end="url(#a)"/><circle cx="120" cy="480" r="3.2" fill="#15120d"/><text x="340.0" y="471" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#15120d" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">list(inv-3, $1,176)</text><text x="340.0" y="497" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">locks the invoice</text><circle cx="1010" cy="532" r="0"/><line x1="1010" y1="532" x2="1216" y2="532" stroke="#15120d" stroke-width="1.8" marker-end="url(#a)"/><circle cx="1010" cy="532" r="3.2" fill="#15120d"/><text x="1115.0" y="523" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#15120d" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">ft_transfer_call(registry, $1,176, {buy: inv-3})</text><circle cx="560" cy="576" r="0"/><line x1="1220" y1="576" x2="564" y2="576" stroke="#15120d" stroke-width="1.8" marker-end="url(#a)"/><circle cx="1220" cy="576" r="3.2" fill="#15120d"/><text x="890.0" y="567" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#15120d" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">ft_on_transfer</text><text x="890.0" y="593" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">owner := Fund, then pay Studio, one receipt</text><circle cx="560" cy="628" r="0"/><line x1="560" y1="628" x2="1216" y2="628" stroke="#1d5a3b" stroke-width="1.8" marker-end="url(#ag)"/><circle cx="560" cy="628" r="3.2" fill="#1d5a3b"/><text x="890.0" y="619" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#1d5a3b" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">ft_transfer($1,176 → Studio Nine)</text><circle cx="120" cy="672" r="0"/><line x1="120" y1="672" x2="556" y2="672" stroke="#c93a1e" stroke-width="1.8" marker-end="url(#ar)" stroke-dasharray="5 4"/><circle cx="120" cy="672" r="3.2" fill="#c93a1e"/><text x="340.0" y="663" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#c93a1e" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">list(inv-3, …) again</text><text x="574" y="694" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#c93a1e" text-anchor="start" font-weight="600" font-style="normal" letter-spacing="0">refused: only the owner can list</text><circle cx="330" cy="738" r="0"/><line x1="330" y1="738" x2="1216" y2="738" stroke="#1d5a3b" stroke-width="1.8" marker-end="url(#ag)"/><circle cx="330" cy="738" r="3.2" fill="#1d5a3b"/><text x="775.0" y="729" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#1d5a3b" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">ft_transfer(inv-3, $1,200)</text><text x="775.0" y="755" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">from any chain via NEAR Intents on mainnet</text><circle cx="560" cy="790" r="0"/><line x1="1010" y1="790" x2="564" y2="790" stroke="#15120d" stroke-width="1.8" marker-end="url(#a)"/><circle cx="1010" cy="790" r="3.2" fill="#15120d"/><text x="785.0" y="781" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#15120d" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">sync(inv-3)</text><text x="785.0" y="807" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">reads ft_balance_of(inv-3); status := Paid</text><circle cx="560" cy="842" r="0"/><line x1="1010" y1="842" x2="564" y2="842" stroke="#15120d" stroke-width="1.8" marker-end="url(#a)"/><circle cx="1010" cy="842" r="3.2" fill="#15120d"/><text x="785.0" y="833" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#15120d" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">claim(inv-3)</text><text x="785.0" y="859" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">owner only; token locked as Claiming</text><circle cx="560" cy="894" r="0"/><line x1="560" y1="894" x2="786" y2="894" stroke="#15120d" stroke-width="1.8" marker-end="url(#a)"/><circle cx="560" cy="894" r="3.2" fill="#15120d"/><text x="675.0" y="885" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#15120d" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">release(Fund, $1,200)</text><circle cx="790" cy="938" r="0"/><line x1="790" y1="938" x2="1216" y2="938" stroke="#1d5a3b" stroke-width="1.8" marker-end="url(#ag)"/><circle cx="790" cy="938" r="3.2" fill="#1d5a3b"/><text x="1005.0" y="929" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#1d5a3b" text-anchor="middle" font-weight="500" font-style="normal" letter-spacing="0">ft_transfer(Fund, $1,200)</text><text x="1005.0" y="955" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#7d7464" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">status := Claimed</text></svg>