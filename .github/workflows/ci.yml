name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts-and-api:
    name: Rust (contracts + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Contract and API tests
        run: cargo test --workspace
      - name: Build the contracts for wasm
        run: cargo build --release --target wasm32-unknown-unknown -p registry -p invoice-account
        env:
          RUSTFLAGS: "--cfg near"
      - name: Contract sizes
        run: ls -l target/wasm32-unknown-unknown/release/*.wasm

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web build
